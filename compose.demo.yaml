services:
  web:
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: municipalidad_yau
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: municipalidad_yau
      MARIADB_USER: "${DB_USER:-app_yau}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-YauDemo2026_db}"
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - yau_demo:/var/lib/mysql
      - ./database/01_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
      - ./database/02_catalogos.sql:/docker-entrypoint-initdb.d/02_catalogos.sql:ro
      - ./database/04_datos_demo.sql:/docker-entrypoint-initdb.d/04_datos_demo.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  yau_demo:
